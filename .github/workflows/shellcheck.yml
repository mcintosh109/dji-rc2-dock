# Checks the shell scripts for common mistakes on every pull request
# and every push to main. Results appear in the "Checks" section of a pull request.
name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ShellCheck comes pre-installed on GitHub's Ubuntu runners
      - name: Run ShellCheck
        run: shellcheck *.sh
