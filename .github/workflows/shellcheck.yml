# Checks the shell scripts for common mistakes and runs the tests, on
# every pull request and every push to main. Results appear in the
# "Checks" section of a pull request.
name: ShellCheck and tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ShellCheck comes pre-installed on GitHub's Ubuntu runners
      - name: Run ShellCheck
        run: shellcheck *.sh tests/*.sh dji-map-link

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tests need rsync; install it if the runner doesn't have it
      - name: Install rsync
        run: command -v rsync || (sudo apt-get update && sudo apt-get install -y rsync)
      - name: Run tests
        run: bash tests/test-sync.sh
      - name: Run the dji-missions tests
        run: python3 tests/test-missions.py
